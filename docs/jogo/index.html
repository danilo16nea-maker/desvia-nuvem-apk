<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173F5F">
  <title>Desvia, Nuvem!</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone-192.png">
  <link rel="apple-touch-icon" href="icone-192.png">
  <link rel="stylesheet" href="placar.css">
  <link rel="stylesheet" href="estilo.css">
  <script src="config.js"></script>
  <script src="placar.js"></script>
  <script src="placar-ui.js"></script>
  <script src="regras.js"></script>
  <script src="pwa.js" defer></script>
  <script src="jogo.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><p class="eyebrow">JOGO DE REFLEXO</p><h1 id="titulo">Desvia, Nuvem!</h1></div>
      <p class="best">Recorde <strong id="best-score">0</strong></p>
    </header>

    <section class="game-shell" aria-label="Área do jogo">
      <canvas id="game" width="360" height="600" aria-label="Desvie dos portais tocando na tela ou pressionando espaço"></canvas>
      <div class="hud" aria-live="polite"><span>Pontos</span><strong id="score">0</strong></div>

      <section id="start-screen" class="overlay" aria-labelledby="start-title">
        <div class="card">
          <div class="cloud-icon" aria-hidden="true">☁️</div>
          <h2 id="start-title">Leve a nuvem pelo céu!</h2>
          <p>Toque na tela ou aperte <kbd>espaço</kbd> para voar. Passe pelo meio dos portais sem encostar.</p>
          <button id="start-button" class="botao" type="button">Começar</button>
        </div>
      </section>

      <section id="end-screen" class="overlay" hidden aria-labelledby="end-title">
        <div class="card">
          <div class="cloud-icon" aria-hidden="true">💫</div>
          <h2 id="end-title">Fim de voo!</h2>
          <p>Você passou por <strong id="final-score">0</strong> portais.</p>
          <p id="save-message" role="status" aria-live="polite"></p>
          <button id="restart-button" class="botao" type="button">Jogar de novo</button>
        </div>
      </section>
    </section>

    <p class="hint">Toque, clique ou use <kbd>espaço</kbd> / <kbd>↑</kbd> para voar.</p>
    <aside id="painel-placar" aria-label="Placar e recordes"></aside>
  </main>
</body>
</html>
